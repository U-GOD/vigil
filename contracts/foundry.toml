[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "prague"
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "../packages/sdk/test/vectors/" },
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 15

[profile.intense]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "../packages/sdk/test/vectors/" },
]
fuzz = { runs = 10_000 }
invariant = { runs = 50_000, depth = 25 }

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", url = "https://api-testnet.monadscan.com/api", chain = 10143 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
